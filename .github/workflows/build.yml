name: Build & Release RefTags
# Release builds are signed with the RefTags Signing certificate (repo secrets) so macOS keeps permissions across updates.

on:
  push:
    branches: ["**"]
    paths:
      - "Sources/**"
      - "Info.plist"
      - "build.sh"
      - "icon.png"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: env.SIGNING_P12 != ''
        run: |
          echo "$SIGNING_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p ci build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain >/dev/null
          security find-certificate -c "RefTags Signing" -p build.keychain > cert.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem
          rm cert.p12
          echo "SIGN_IDENTITY=RefTags Signing" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          chmod +x build.sh
          CI=1 ./build.sh
          codesign -dv build/RefTags.app 2>&1 | grep -E "Identifier|Authority|Signature" || true
          codesign -d -r- build/RefTags.app 2>&1 | tail -1

      - name: Zip
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent RefTags.app ../RefTags.zip

      - name: Keep test build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: RefTags-test-build
          path: RefTags.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" RefTags.zip \
            --title "RefTags $TAG" \
            --notes "**Install:** unzip, drag **RefTags** into Applications and open it.
          First launch: System Settings → Privacy & Security → **Open Anyway**, then switch on RefTags under **Accessibility**."
